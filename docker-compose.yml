  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=voxfox_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=uuid-ossp"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
