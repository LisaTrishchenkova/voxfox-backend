services:
  voxfox:
    image: voxfox-webapi
    container_name: voxfox-api
    build:
      context: .
      dockerfile: VoxFox/Dockerfile
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=1
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=voxfox_db;Username=postgres;Password=password
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      - POSTGRES_DB=voxfox_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=uuid-ossp"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
