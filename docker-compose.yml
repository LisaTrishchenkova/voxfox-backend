services:
  voxfox:
    image: voxfox-webapi
    pull_policy: if_not_present
    container_name: voxfox-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8081"
      - "9090:9091"
    environment:
      - Ports__Api=8081
      - Ports__Metrics=9091
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=1
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=voxfox_db;Username=postgres;Password=password
      - TEMPO_ENDPOINT=http://tempo:4317
      - Elasticsearch__Uri=http://elasticsearch:9200
      - Elasticsearch__IndexName=voxfox-lessons
    depends_on:
      - postgres
      - tempo # Добавляем зависимость от Tempo

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.2
    pull_policy: if_not_present
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  postgres:
    image: postgres:15
    pull_policy: if_not_present
    restart: unless-stopped
    environment:
      - POSTGRES_DB=voxfox_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=uuid-ossp"
    ports:
      - "5436:5432"
    volumes:
      - voxfox_postgres_data:/var/lib/postgresql/data

  # Добавляем Tempo
  tempo:
    image: grafana/tempo:latest
    pull_policy: if_not_present
    container_name: tempo
    command:
      - "-config.file=/etc/tempo.yaml"
    volumes:
      - ./tempo-config.yaml:/etc/tempo.yaml
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200" # API и UI Tempo
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    environment:
      - JAEGER_AGENT_HOST=tempo
      - JAEGER_AGENT_PORT=6831

  # Опционально: добавить Grafana для просмотра трейсов локально
  grafana:
    image: grafana/grafana:latest
    pull_policy: if_not_present
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    depends_on:
      - tempo

  kibana:
    image: docker.elastic.co/kibana/kibana:9.3.2
    pull_policy: if_not_present
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  voxfox_postgres_data:
  tempo_data:
  elasticsearch_data:
