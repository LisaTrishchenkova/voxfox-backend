name: Build and Deploy Backend to PRODUCTION

env:
  AWS_REGION: eu-north-1
  AWS_IAM_ROLE: arn:aws:iam::703671934401:role/github-actions
  ECR_REPOSITORY: lisatrishchenkova/voxfox-practice-backend

on:
  workflow_dispatch: # ✅ Только ручной запуск!
    inputs:
      version:
        description: "Version to deploy (v*.*.* or commit SHA)"
        required: true
        type: string
      confirm:
        description: "⚠️ PRODUCTION DEPLOYMENT - Are you ABSOLUTELY sure?"
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

concurrency:
  group: deploy-backend-prod
  cancel-in-progress: false

jobs:
  build-and-push:
    if: ${{ github.event.inputs.confirm == 'yes' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
      image_url: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.version }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_IAM_ROLE }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate production tag
        id: tag
        run: |
          VERSION="${{ github.event.inputs.version }}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date -u +'%Y%m%d-%H%M')

          # Если версия в формате v*, используем её, иначе создаем
          if [[ $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IMAGE_TAG="${VERSION}"
          else
            IMAGE_TAG="prod-${DATE}-${SHORT_SHA}"
          fi

          echo "tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "debug_tag=prod-${DATE}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "app_version=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "commit=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

          echo "🚀 Production version: ${IMAGE_TAG}"

      - name: Build and push PRODUCTION image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          APP_VERSION: ${{ steps.tag.outputs.app_version }}
          GIT_COMMIT: ${{ steps.tag.outputs.commit }}
          BUILD_DATE: ${{ steps.tag.outputs.build_date }}
        run: |
          docker buildx create --use --name builder
          docker buildx inspect builder --bootstrap

          docker buildx build \
            --target production \
            --build-arg APP_VERSION=${APP_VERSION} \
            --build-arg GIT_COMMIT=${GIT_COMMIT} \
            --build-arg BUILD_DATE=${BUILD_DATE} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG} \
            --load \
            -f Dockerfile .

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG}

          docker buildx rm builder

      - name: Create GitHub Release
        if: ${{ startsWith(github.event.inputs.version, 'v') }} # ✅ Только для версий v*
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          body: |
            🚀 **Production Release ${{ github.event.inputs.version }}**

            **Deployed by:** @${{ github.actor }}
            **Docker Image:** `${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}`

            [View deployment run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          draft: false
          prerelease: false

      - name: Notify success
        if: success()
        uses: actions-cool/maintain-one-comment@v3
        with:
          body: |
            🚀 **PRODUCTION BACKEND DEPLOYED SUCCESSFULLY!**

            **Version:** `${{ steps.tag.outputs.tag }}`
            **Deployed by:** @${{ github.actor }}
            **Commit:** [`${{ steps.tag.outputs.commit }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.inputs.version }})

            🔗 **Links:**
            • 📦 **ECR Image:** `${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}`
            • 🏷️ **Git Tag:** ${{ github.event.inputs.version }}

            [View deployment run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Auto-rollback on failure
        if: failure()
        run: |
          echo "🔄 CRITICAL: Production deployment failed! Check manually!"
          # Здесь можно добавить уведомление в Slack/Telegram

      - name: Notify failure
        if: failure()
        uses: actions-cool/maintain-one-comment@v3
        with:
          body: |
            ❌ **PRODUCTION BACKEND DEPLOYMENT FAILED!**

            **Version:** `${{ steps.tag.outputs.tag }}`
            **Deployed by:** @${{ github.actor }}
            **Commit:** [`${{ steps.tag.outputs.commit }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.inputs.version }})

            **Action required:** Investigate immediately!

            [View failed run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
