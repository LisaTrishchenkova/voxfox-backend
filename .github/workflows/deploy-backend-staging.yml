name: Build and Push to ECR (STAGING)

env:
  AWS_REGION: eu-north-1
  AWS_IAM_ROLE: arn:aws:iam::703671934401:role/github-actions
  ECR_REPOSITORY: lisatrishchenkova/voxfox-practice-backend

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [staging]

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_IAM_ROLE }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate staging tag
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH_NAME="${{ github.event.workflow_run.head_branch }}"
          DATE=$(date -u +'%Y%m%d-%H%M')

          BRANCH_NAME_CLEAN=${BRANCH_NAME//\//-}

          # TODO: изменить получение версии
          # ВРЕМЕННО: используем v0.0.1
          # ПОТОМ ЗАМЕНИТЬ НА:
          # VERSION_TAG=$(bash ./scripts/get_version.sh)
          IMAGE_TAG="v0.2.2"

          # Добавим еще тег с датой для отладки
          DEBUG_TAG="staging-${DATE}-${SHORT_SHA}"

          echo "tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "debug_tag=${DEBUG_TAG}" >> $GITHUB_OUTPUT
          echo "app_version=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "commit=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

          echo "Current tag: ${IMAGE_TAG} (temporary)"
          echo "Debug tag: ${DEBUG_TAG}"

      - name: Build and push STAGING image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          APP_VERSION: ${{ steps.tag.outputs.app_version }}
          GIT_COMMIT: ${{ steps.tag.outputs.commit }}
          BUILD_DATE: ${{ steps.tag.outputs.build_date }}
        run: |
          docker buildx create --use --name builder
          docker buildx inspect builder --bootstrap

          docker buildx build \
            --target staging \
            --build-arg APP_VERSION=${APP_VERSION} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG} \
            --load \
            -f Dockerfile .

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG}

          docker buildx rm builder

      - name: Notify Telegram on success
        if: success()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_ACTIONS_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_ACTIONS_CHAT_ID }}
        run: |
          # Функция для экранирования специальных символов MarkdownV2
          escape_markdown() {
            echo "$1" | sed 's/[_*\[\]()~`>#+\-=|{}.!]/\\&/g'
          }

          # Формируем сообщение
          MESSAGE="✅ *Dev deploy successful!*

          📦 *Image:* $(escape_markdown "`${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}`")
          🔗 *Commit:* $(escape_markdown "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha }}")
          🌿 *Branch:* $(escape_markdown "`${{ github.event.workflow_run.head_branch }}`")
          🏷️ *Tag:* $(escape_markdown "`${{ steps.tag.outputs.tag }}`")

          🔍 [View Run]($(escape_markdown "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"))"

          # Отправляем в Telegram
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d parse_mode="MarkdownV2" \
            -d disable_web_page_preview=true

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_ACTIONS_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_ACTIONS_CHAT_ID }}
        run: |
          # Функция для экранирования специальных символов MarkdownV2
          escape_markdown() {
            echo "$1" | sed 's/[_*\[\]()~`>#+\-=|{}.!]/\\&/g'
          }

          # Формируем сообщение
          MESSAGE="❌ *Dev deploy failed!*

          🌿 *Branch:* $(escape_markdown "`${{ github.event.workflow_run.head_branch }}`")
          🔗 *Commit:* $(escape_markdown "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha }}")

          ⚠️ [View Failed Run]($(escape_markdown "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"))"

          # Отправляем в Telegram
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d parse_mode="MarkdownV2" \
            -d disable_web_page_preview=true
