name: Build and Push Backend to ECR (STAGING)

env:
  AWS_REGION: eu-north-1
  AWS_IAM_ROLE: arn:aws:iam::703671934401:role/github-actions
  ECR_REPOSITORY: lisatrishchenkova/voxfox-practice-backend

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      version_type:
        description: "Type version"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  staging:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_IAM_ROLE }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate staging version
        id: version
        run: |
          VERSION_TYPE=${{ github.event.inputs.version_type || 'patch' }}
          bash ./scripts/git_update.sh -v $VERSION_TYPE

      - name: Build and push staging image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          VERSION_TAG: ${{ steps.version.outputs.new-tag }}
        run: |
          # Setup buildx
          docker buildx create --use --name builder
          docker buildx inspect builder --bootstrap

          # Build with buildx
          docker buildx build \
            --target staging \
            --build-arg APP_VERSION=${{ steps.version.outputs.new-tag }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:staging \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:staging-latest \
            --load \
            -f Dockerfile .

          # Push to ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:staging-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:staging

          # Cleanup
          docker buildx rm builder

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.new-tag }}
          name: Release ${{ steps.version.outputs.new-tag }}
          generate_release_notes: true
