name: Build and Push Backend to ECR (STAGING)

env:
  AWS_REGION: eu-north-1
  AWS_IAM_ROLE: arn:aws:iam::703671934401:role/github-actions
  ECR_REPOSITORY: voxfox-backend-staging

on:
  push:
    branches: ["staging", "release/*"]
    paths:
      - "VoxFox/**"
      - "Dockerfile"
  workflow_dispatch:
    inputs:
      tag:
        description: "Custom tag (optional)"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: cd VoxFox && dotnet restore

      - name: Build
        run: cd VoxFox && dotnet build --configuration Release --no-restore

      - name: Test
        run: cd VoxFox && dotnet test --configuration Release --no-build --verbosity normal

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_IAM_ROLE }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate staging tag
        id: tag
        run: |
          if [[ "${{ github.event.inputs.tag }}" != "" ]]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
            echo "source=manual" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            DATE=$(date -u +'%Y%m%d-%H%M')
            echo "tag=staging-${DATE}-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "source=auto" >> $GITHUB_OUTPUT
          fi
          echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build and push STAGING image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Build staging image (с отладочными инструментами!)
          docker build \
            --target staging \
            --build-arg BUILD_DATE="${{ steps.tag.outputs.timestamp }}" \
            --build-arg VCS_REF="${{ github.sha }}" \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest-staging \
            -f Dockerfile .

          # Push образа
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest-staging

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Notify staging deployment
        run: |
          echo "✅ Staging deployment complete!"
          echo "📦 Image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}"
          echo "🔍 Source: ${{ steps.tag.outputs.source }}"

      - name: Verify image in ECR
        run: |
          aws ecr describe-images \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --image-ids imageTag=${{ steps.tag.outputs.tag }} \
            --region ${{ env.AWS_REGION }}
