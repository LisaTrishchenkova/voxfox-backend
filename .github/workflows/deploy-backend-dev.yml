name: Build and Push Backend to ECR (DEV)

env:
  AWS_REGION: eu-north-1
  AWS_IAM_ROLE: arn:aws:iam::703671934401:role/github-actions
  ECR_REPOSITORY: lisatrishchenkova/voxfox-practice-backend
  DOTNET_VERSION: "9.0.x"

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - staging

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: cd VoxFox && dotnet restore

      - name: Run tests
        run: |
          cd VoxFox
          dotnet test --configuration Release --no-restore --verbosity normal

      - name: Run linter
        continue-on-error: true
        run: |
          cd VoxFox
          dotnet format --verify-no-changes

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_IAM_ROLE }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate dev tag
        if: github.event_name == 'push'
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH_NAME=${GITHUB_REF_NAME//\//-}
          DATE=$(date -u +'%Y%m%d-%H%M')

          IMAGE_TAG="${BRANCH_NAME}-${DATE}-${SHORT_SHA}"

          echo "tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "app_version=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "commit=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Build and push DEV image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: development
          push: true
          build-args: |
            APP_VERSION=${{ steps.tag.outputs.app_version }}
            GIT_COMMIT=${{ steps.tag.outputs.commit }}
            BUILD_DATE=${{ steps.tag.outputs.build_date }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Clean old dev images (keep last 10)
        if: github.ref_name == 'dev' && github.event_name == 'push'
        run: |
          # Получаем список всех тегов кроме dev-latest, сортируем, оставляем последние 10
          aws ecr list-images --repository-name ${{ env.ECR_REPOSITORY }} \
            --filter tagStatus=TAGGED \
            --query 'imageIds[?imageTag!=`dev-latest`]' \
            --output text | tr '\t' '\n' | grep -v '^$' | sort -r | tail -n +11 | while read tag; do
              echo "Deleting old image: $tag"
              aws ecr batch-delete-image --repository-name ${{ env.ECR_REPOSITORY }} \
                --image-ids imageTag=$tag || true
          done

      - name: Notify on failure
        if: failure() && github.event_name == 'push'
        run: |
          # Для Telegram
          MESSAGE="❌ DEV build failed for branch \`${{ github.ref_name }}\`%0ACommit: ${{ github.sha }}%0AURL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_ACTIONS_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_ACTIONS_CHAT_ID }}" \
            -d "text=$MESSAGE" \
            -d "parse_mode=Markdown"
