name: Build and Push Backend to ECR (DEV)

env:
  AWS_REGION: eu-north-1
  AWS_IAM_ROLE: arn:aws:iam::703671934401:role/github-actions
  ECR_REPOSITORY: lisatrishchenkova/voxfox-practice-backend

on:
  push:
    branches: ["dev", "feature/*", "bugfix/*", "chore/*"]
    paths:
      - "VoxFox/**"
      - "Dockerfile"
  pull_request:
    branches: [dev]
    paths:
      - "VoxFox/**"
      - "Dockerfile"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_IAM_ROLE }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate dev tag
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH_NAME=${GITHUB_REF_NAME//\//-}
          DATE=$(date -u +'%Y%m%d-%H%M')

          IMAGE_TAG="${BRANCH_NAME}-${DATE}-${SHORT_SHA}"

          echo "tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "app_version=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "commit=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build and push DEV image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          APP_VERSION: ${{ steps.tag.outputs.app_version }}
          GIT_COMMIT: ${{ steps.tag.outputs.commit }}
          BUILD_DATE: ${{ steps.tag.outputs.build_date }}
        run: |
          docker buildx create --use --name builder
          docker buildx inspect builder --bootstrap

          docker buildx build \
            --target development \
            --build-arg APP_VERSION=${APP_VERSION} \
            --build-arg GIT_COMMIT=${GIT_COMMIT} \
            --build-arg BUILD_DATE=${BUILD_DATE} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:dev-latest \
            --load \
            -f Dockerfile .

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:dev-latest

          docker buildx rm builder
