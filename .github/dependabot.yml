version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Moscow"
    target-branch: "dev"
    labels:
      - "dependencies"
      - "nuget"
    open-pull-requests-limit: 5
    reviewers:
      - "GulidovAlexander"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      entity-framework:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Npgsql.EntityFrameworkCore*"
      aspnetcore:
        patterns:
          - "Microsoft.AspNetCore.*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Moscow"
    target-branch: "dev"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 3
    reviewers:
      - "GulidovAlexander"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Moscow"
    target-branch: "dev"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
