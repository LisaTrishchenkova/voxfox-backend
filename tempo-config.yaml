server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks
    block:
      version: v2
      index_downsample_bytes: 1000
    wal:
      path: /tmp/tempo/wal

compactor:
  compaction:
    block_retention: 24h

overrides:
  defaults:
    metrics_generator:
      processor:
        service_graphs:
          enabled: true
